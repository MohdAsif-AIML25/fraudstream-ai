# Prometheus configuration: WHAT to scrape and HOW OFTEN.
# Day 7: the API and worker run in Docker too, so Prometheus reaches them by SERVICE NAME
# on the shared Docker network (api:8000, worker:8001), not via host.docker.internal.

global:
  scrape_interval: 15s       # fetch /metrics every 15 seconds
  evaluation_interval: 15s   # check alert rules every 15 seconds

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fraudstream-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: fraudstream-worker
    static_configs:
      - targets: ["worker:8001"]

  - job_name: prometheus     # Prometheus monitors itself (useful to see scrape problems)
    static_configs:
      - targets: ["localhost:9090"]