name: fraudstream-ai

# Day 7: the WHOLE system in one command:   docker compose up -d --build
#
#   infrastructure : postgres, redis, kafka, prometheus, grafana
#   one-shot jobs  : migrate (alembic upgrade head), topics (create Kafka topics)  -> run, then exit 0
#   services       : api, worker, dashboard  (one image, built from ./Dockerfile)
#
# Inside the Docker network, containers reach each other by SERVICE NAME (postgres, redis, kafka:19092),
# not 127.0.0.1. Ports are still published on 127.0.0.1 so your laptop can reach them too.

x-app: &app                                   # shared settings for every service built from our Dockerfile
  build: .
  image: fraudstream-ai:latest
  env_file: .env                              # passwords etc. come from .env (never baked into the image)
  environment:                                # these OVERRIDE .env: container addresses instead of 127.0.0.1
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"                     # port INSIDE the network (5433 is only the host-side port)
    REDIS_URL: redis://redis:6379/0
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092      # the INTERNAL Kafka listener (see kafka service)
  restart: unless-stopped

services:
  # ------------------------------------------------------------------ infrastructure
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.3.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"                  # host listener only (your laptop scripts)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Day 7: TWO client listeners. A client connects, then Kafka tells it which address to use
      # ("advertised"). Your laptop must be told 127.0.0.1:9092; a container must be told kafka:19092
      # (127.0.0.1 inside a container means the container itself -> connection refused).
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  # ------------------------------------------------------------------ one-shot jobs
  migrate:                                    # brings the DB schema to the latest Alembic version, then exits
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"                             # a job must NOT restart after it finished successfully
    depends_on:
      postgres:
        condition: service_healthy

  topics:                                     # creates transactions.raw + .dlq (safe to run again)
    <<: *app
    command: ["python", "-m", "scripts.create_topics"]
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy

  # ------------------------------------------------------------------ services
  api:
    <<: *app
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully   # never serve requests before the schema exists
      topics:
        condition: service_completed_successfully
    healthcheck:                              # python instead of curl: the slim image has no curl
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    <<: *app
    command: ["python", "-m", "app.worker.main"]
    environment:                              # repeat the shared overrides (a service's own environment replaces the anchor's)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      WORKER_METRICS_HOST: 0.0.0.0            # inside a container 127.0.0.1 is unreachable from Prometheus
    volumes:
      - ./artifacts:/app/artifacts:ro         # the trained model (gitignored binary) is mounted, read-only
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      topics:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/metrics', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  dashboard:
    <<: *app
    command: ["streamlit", "run", "dashboard/review_app.py",
              "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    environment:
      FRAUDSTREAM_API_URL: http://api:8000     # the API by service name
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data: